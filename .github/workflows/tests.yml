name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[web,test]"
      - run: python -m pytest --cov=trade_catalog_kit --cov-report=term-missing
      - run: python -m pip check
      - run: trade-catalog examples/furniture.xlsx --images examples/images --out generated-catalog.pdf
      - if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python -m build
      - if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python -m twine check dist/*
