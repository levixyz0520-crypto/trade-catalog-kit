[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-catalog-kit"
version = "0.2.0"
description = "Generate professional B2B product catalogs from spreadsheets and local images."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Pillow>=13.0,<14", "reportlab>=4.4,<5", "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1"]

[project.optional-dependencies]
web = ["streamlit>=1.67,<2", "pypdfium2>=4.30,<6"]
ai = ["rembg[cpu]>=2.0.88,<3"]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "pypdf>=6,<7", "build>=1.2,<2", "twine>=6,<8"]

[project.scripts]
trade-catalog = "trade_catalog_kit.cli:main"

[project.urls]
Repository = "https://github.com/levixyz0520-crypto/trade-catalog-kit"
Issues = "https://github.com/levixyz0520-crypto/trade-catalog-kit/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
